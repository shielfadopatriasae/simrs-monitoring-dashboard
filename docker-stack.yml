version: '3.8'

services:
  app:
    image: simrs-dashboard-app:latest
    env_file: .env
    volumes:
      - app-storage:/var/www/html/storage
      - app-public:/var/www/html/public
    networks:
      - simrs-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager # Ganti ke "node.hostname == nama_node" jika multi-node cluster tanpa registry
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  web:
    image: nginx:alpine
    ports:
      - target: 80
        published: 8000
        protocol: tcp
        mode: ingress
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo 'server {
            listen 80;
            index index.php index.html;
            root /var/www/html/public;
            location / {
                try_files $$uri $$uri/ /index.php?$$query_string;
            }
            location ~ \.php$$ {
                try_files $$uri =404;
                fastcgi_split_path_info ^(.+\.php)(/.+)$$;
                fastcgi_pass app:9000;
                fastcgi_index index.php;
                include fastcgi_params;
                fastcgi_param SCRIPT_FILENAME $$document_root$$fastcgi_script_name;
                fastcgi_param PATH_INFO $$fastcgi_path_info;
            }
        }' > /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    volumes:
      - app-public:/var/www/html/public
    networks:
      - simrs-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager # Ganti ke "node.hostname == nama_node" jika multi-node cluster tanpa registry
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

volumes:
  app-storage:
  app-public:

networks:
  simrs-network:
    driver: overlay
    attachable: true
