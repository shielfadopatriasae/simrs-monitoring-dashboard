version: '3.8'

services:
  app:
    image: simrs-dashboard-app:latest
    env_file: .env
    volumes:
      - app-storage:/var/www/html/storage
      - app-public:/var/www/html/public
    networks:
      - simrs-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager # Ganti ke "node.hostname == nama_node" jika multi-node cluster tanpa registry
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  web:
    image: nginx:alpine
    ports:
      - target: 80
        published: 8000
        protocol: tcp
        mode: ingress
    volumes:
      - app-public:/var/www/html/public
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - simrs-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager # Ganti ke "node.hostname == nama_node" jika multi-node cluster tanpa registry
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

volumes:
  app-storage:
  app-public:

networks:
  simrs-network:
    driver: overlay
    attachable: true
